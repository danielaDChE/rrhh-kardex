<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de sesión | SEDEGES La Paz</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#1f2d3d 0%,#2a3f54 55%,#3d5a73 100%);
      color:#2a3f54;
    }
    .login-wrapper{
      width:100%;
      max-width:430px;
      padding:22px;
    }
    .login-card{
      background:#fff;
      border-radius:14px;
      box-shadow:0 18px 45px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .header{
      background:#2a3f54;
      color:#fff;
      text-align:center;
      padding:28px 24px 22px;
    }
    .brand{
      font-size:27px;
      font-weight:700;
      letter-spacing:.5px;
      margin-bottom:5px;
    }
    .subtitle{
      font-size:13px;
      opacity:.9;
      line-height:1.45;
    }
    .body{
      padding:30px 30px 24px;
    }
    .title{
      margin:0 0 7px;
      text-align:center;
      font-size:22px;
      color:#2a3f54;
    }
    .desc{
      margin:0 0 24px;
      text-align:center;
      color:#6b7785;
      font-size:13px;
    }
    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:0 0 7px;
      color:#44515f;
    }
    input{
      width:100%;
      padding:12px 13px;
      border:1px solid #d8dee5;
      border-radius:7px;
      font-size:14px;
      outline:none;
      margin-bottom:18px;
      transition:.2s;
    }
    input:focus{
      border-color:#26b99a;
      box-shadow:0 0 0 3px rgba(38,185,154,.12);
    }
    button{
      width:100%;
      border:0;
      border-radius:7px;
      background:#26b99a;
      color:#fff;
      padding:13px 16px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }
    button:hover{background:#209e84}
    .note{
      margin-top:18px;
      background:#f5f7f9;
      border-left:4px solid #26b99a;
      padding:10px 12px;
      border-radius:5px;
      font-size:12px;
      color:#65717d;
      line-height:1.45;
    }
    .footer{
      text-align:center;
      padding:0 30px 24px;
      font-size:11px;
      color:#8b95a0;
    }
    @media(max-width:480px){
      .login-wrapper{padding:14px}
      .body{padding:25px 22px 20px}
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="header">
        <div class="brand">SEDEGES LA PAZ</div>
        <div class="subtitle">Sistema Integrado de Gestión de Personal</div>
      </div>

      <div class="body">
        <h1 class="title">Inicio de sesión</h1>
        <p class="desc">Ingrese sus credenciales para acceder al sistema.</p>

        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" placeholder="Ingrese su usuario" autocomplete="username">

          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Ingrese su contraseña" autocomplete="current-password">

          <button type="submit">Iniciar sesión</button>
        </form>

        <div class="note">
          Demo visual: no se validan las credenciales. Al presionar <b>Iniciar sesión</b> se abrirá directamente el sistema.
        </div>
      </div>

      <div class="footer">
        Entorno de demostración – datos ficticios
      </div>
    </div>
  </div>
</body>
</html>
